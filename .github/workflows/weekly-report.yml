name: MTR weekly signal report

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional final market date YYYY-MM-DD"
        required: false
        type: string
  schedule:
    # Saturday after the Friday daily scan and its state commit.
    - cron: "30 3 * * 6"

permissions:
  contents: read
  issues: write

concurrency:
  group: mtr-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner
        run: pip install -e .

      - name: Build weekly signal report
        run: |
          args=(weekly --output mtr-weekly-report.md)
          if [[ -n "${{ inputs.as_of }}" ]]; then args+=(--as-of "${{ inputs.as_of }}"); fi
          python -m mtr_scanner.github_reports "${args[@]}"

      - name: Publish weekly GitHub notification
        uses: actions/github-script@v7
        with:
          script: |
            const postReport = require('./.github/scripts/post-report.js');
            await postReport({ github, context, core }, 'mtr-weekly-report.md');
