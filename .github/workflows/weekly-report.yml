name: MTR weekly signal report

on:
  push:
    branches: [main]
    paths:
      # Also smoke-test email delivery whenever this workflow itself changes.
      - ".github/workflows/weekly-report.yml"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional final market date YYYY-MM-DD"
        required: false
        type: string
  schedule:
    # Saturday after the Friday daily scan and its state commit.
    - cron: "30 3 * * 6"

permissions:
  contents: write

concurrency:
  group: mtr-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner
        run: pip install -e .

      - name: Send weekly signal report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          args=(--send)
          if [[ -n "${{ inputs.as_of }}" ]]; then args+=(--as-of "${{ inputs.as_of }}"); fi
          python -m mtr_scanner.weekly_report "${args[@]}"

      - name: Commit weekly report receipt
        run: |
          git config user.name "mtr-signal-bot"
          git config user.email "mtr-signal-bot@users.noreply.github.com"
          git add state/weekly_reports.json
          if git diff --cached --quiet; then
            echo "Weekly report already registered"
          else
            git commit -m "state: register weekly MTR report [skip ci]"
            git push
          fi
